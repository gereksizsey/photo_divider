name: photo_divider
description: "Split a photo into horizontal, vertical or grid pieces right in your browser. Nothing is uploaded."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  gal: ^3.0.1
  image: ^4.13.1
  share_plus: ^13.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
